<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Your Room</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport bg-room">
    <a href="index.html" class="back-btn">↩</a>

    <div class="room-layout">
      <!-- Main Room Blob -->
      <div class="chalk-blob room-panel">
        <h1 style="font-family:var(--font-title); font-size:2.8rem; color:var(--color-green); text-decoration:underline; margin-bottom:4px;">
          Your Room
        </h1>
        <div class="room-code-display" id="roomCodeDisplay" title="Click to copy" onclick="copyCode()">
          code: ----
        </div>

        <!-- 2x2 Player Grid -->
        <div class="players-grid-2x2">
          <!-- Slot 1 -->
          <div class="player-slot" id="slot1">
            <div class="player-avatar" style="position:relative;">
              <canvas id="avatarCanvas1" width="80" height="80"></canvas>
              <div class="player-status-dots">
                <div class="status-dot green"></div>
              </div>
            </div>
            <div class="player-name" id="nameSlot1">You</div>
          </div>
          <!-- Slot 2 -->
          <div class="player-slot" id="slot2">
            <div class="player-avatar" style="position:relative;">
              <canvas id="avatarCanvas2" width="80" height="80"></canvas>
              <div class="player-status-dots">
                <div class="status-dot grey"></div>
              </div>
            </div>
            <div class="player-name waiting" id="nameSlot2">Waiting...</div>
          </div>
          <!-- Slot 3 -->
          <div class="player-slot" id="slot3">
            <div class="player-avatar" style="position:relative;">
              <canvas id="avatarCanvas3" width="80" height="80"></canvas>
              <div class="player-status-dots">
                <div class="status-dot grey"></div>
              </div>
            </div>
            <div class="player-name waiting" id="nameSlot3">Waiting...</div>
          </div>
          <!-- Slot 4 -->
          <div class="player-slot" id="slot4">
            <div class="player-avatar" style="position:relative;">
              <canvas id="avatarCanvas4" width="80" height="80"></canvas>
              <div class="player-status-dots">
                <div class="status-dot grey"></div>
              </div>
            </div>
            <div class="player-name waiting" id="nameSlot4">Waiting...</div>
          </div>
        </div>

        <!-- START button -->
        <button id="startBtn" onclick="handleStartClick()" class="blob-btn btn-green"
          style="font-size:2.4rem; padding:0.5rem 3rem; margin-top:8px; width:100%;">
          START
        </button>
      </div>

      <!-- Friends Side Panel -->
      <div class="friends-side-panel">
        <h3>Friends</h3>
        <div id="friendsList"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/blob-panel.js"></script>
  <script src="js/multiplayer.js"></script>
  <script>
    let isHost = false;
    let roomCode = '7608';

    function drawPlayerAvatar(canvasId, playerConfig, active) {
      const c = document.getElementById(canvasId);
      if (!c) return;
      if (active) {
        drawStickMascot(c, playerConfig);
      } else {
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 2.5;
        // Head outline
        ctx.beginPath(); ctx.arc(40, 28, 20, 0, Math.PI * 2); ctx.stroke();
        // Body outline
        ctx.beginPath(); ctx.arc(40, 60, 16, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(roomCode).catch(() => {});
      const el = document.getElementById('roomCodeDisplay');
      el.innerText = `code: ${roomCode} ✓`;
      setTimeout(() => el.innerText = `code: ${roomCode}`, 2000);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      roomCode = urlParams.get('code') || sessionStorage.getItem('roomCode') || '7608';
      isHost = urlParams.get('host') === 'true' || sessionStorage.getItem('isHost') === 'true';

      document.getElementById('roomCodeDisplay').innerText = `code: ${roomCode}`;

      const username = localStorage.getItem('pyb_username') || 'You';
      document.getElementById('nameSlot1').innerText = username;

      // Draw initial avatar for local player
      const localChar = JSON.parse(localStorage.getItem('pyb_character') || '{}');
      drawPlayerAvatar('avatarCanvas1', localChar, true);
      for (let i = 2; i <= 4; i++) drawPlayerAvatar(`avatarCanvas${i}`, null, false);

      if (!isHost) {
        const btn = document.getElementById('startBtn');
        btn.innerText = 'Waiting...';
        btn.style.opacity = '0.6';
        btn.style.cursor = 'not-allowed';
      }

      if (window.PYBMultiplayer) {
        await window.PYBMultiplayer.init(roomCode, isHost, username, 'lobby');
      }

      // Render friends in side panel
      const friends = JSON.parse(localStorage.getItem('pyb_friends') || '[]');
      const fl = document.getElementById('friendsList');
      fl.innerHTML = '';
      if (friends.length === 0) {
        fl.innerHTML = '<div style="font-family:var(--font-body);font-size:1.3rem;color:#888;margin-top:8px;">No friends yet!</div>';
      } else {
        friends.forEach(f => {
          const row = document.createElement('div');
          row.className = 'friend-row';
          row.innerHTML = `<span>${f}</span><button class="friend-plus-btn" onclick="this.innerText='✓'">+</button>`;
          fl.appendChild(row);
        });
      }
    });

    window.updateLobbyUI = function(players) {
      for (let i = 1; i <= 4; i++) {
        const nameEl = document.getElementById(`nameSlot${i}`);
        const dotEl = document.querySelector(`#slot${i} .status-dot`);
        const player = players[i - 1];
        if (player) {
          nameEl.innerText = player.name + (player.isHost ? ' 👑' : '');
          nameEl.className = 'player-name';
          drawPlayerAvatar(`avatarCanvas${i}`, player.character, true);
          if (dotEl) { dotEl.className = 'status-dot green'; }
        } else {
          nameEl.innerText = 'Waiting...';
          nameEl.className = 'player-name waiting';
          drawPlayerAvatar(`avatarCanvas${i}`, null, false);
          if (dotEl) { dotEl.className = 'status-dot grey'; }
        }
      }
    };

    function handleStartClick() {
      if (isHost && window.PYBMultiplayer) {
        window.PYBMultiplayer.triggerStartGame();
      } else if (isHost) {
        window.location.href = `play.html?code=${roomCode}`;
      } else {
        alert('Waiting for the host to start!');
      }
    }
  </script>
</body>
</html>
