<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Play</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html { overflow: hidden; }

    .play-bg {
      background-image: url('css/bg_main_menu.png');
      background-size: cover;
      background-position: center;
    }

    .main-cam-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border: 8px solid #27ae60;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 3px rgba(39,174,96,0.35), 4px 4px 0 #111;
    }

    #peerVideo, #drawingCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #drawingCanvas {
      z-index: 10;
      cursor: crosshair;
    }

    .timer-display {
      position: absolute;
      top: 14px;
      right: 198px;
      font-family: var(--font-title);
      font-size: 3.2rem;
      color: #111;
      z-index: 200;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.9);
      pointer-events: none;
    }

    /* Loading overlay while MediaPipe boots */
    #arLoadingOverlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 10px;
      transition: opacity 0.5s;
    }

    #arLoadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: white;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
    }

    .loading-spinner {
      width: 48px; height: 48px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: #27ae60;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Face detection indicator */
    #faceIndicator {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-body);
      font-size: 1.2rem;
      color: #27ae60;
      background: rgba(255,255,255,0.85);
      padding: 3px 12px;
      border-radius: 20px;
      border: 2px solid #111;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport play-bg">
    <!-- Timer -->
    <div class="timer-display" id="timerDisplay">01:00</div>

    <div class="play-layout">
      <!-- Main camera area with AR canvas -->
      <div class="main-cam-area">
        <div class="main-cam-frame">
          <!-- AR loading overlay -->
          <div id="arLoadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading face tracking...</div>
          </div>

          <!-- Peer webcam video (unmuted so you hear their voice chat) -->
          <video id="peerVideo" autoplay playsinline></video>

          <!-- Drawing canvas (AR face paint layer) -->
          <canvas id="drawingCanvas"></canvas>

          <!-- Face detection indicator -->
          <div id="faceIndicator">👤 Waiting for face...</div>
        </div>
      </div>

      <!-- Right sidebar: PIP + toolbar -->
      <div class="play-sidebar">
        <!-- Your own webcam PIP (with overlay for friend's drawings on your face) -->
        <div class="pip-cam-box" style="position: relative;">
          <video id="localVideo" autoplay playsinline muted></video>
          <canvas id="localDrawingCanvas" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></canvas>
        </div>

        <!-- Tool blob -->
        <div class="toolbar-blob">
          <!-- Colour swatches -->
          <div class="color-palette-row">
            <div class="color-swatch" style="background:#e74c3c;" onclick="selectColor('#e74c3c',this)"></div>
            <div class="color-swatch" style="background:#e67e22;" onclick="selectColor('#e67e22',this)"></div>
            <div class="color-swatch" style="background:#f1c40f;" onclick="selectColor('#f1c40f',this)"></div>
            <div class="color-swatch active" style="background:#27ae60;" onclick="selectColor('#27ae60',this)"></div>
            <div class="color-swatch" style="background:#2980b9;" onclick="selectColor('#2980b9',this)"></div>
            <div class="color-swatch" style="background:#8e44ad;" onclick="selectColor('#8e44ad',this)"></div>
            <div class="color-swatch" style="background:#ffffff; border-color:#888;" onclick="selectColor('#ffffff',this)"></div>
            <div class="color-swatch" style="background:#111111;" onclick="selectColor('#111111',this)"></div>
          </div>

          <!-- Tools -->
          <button class="tool-btn active" id="toolCrayon" onclick="selectTool('crayon')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5">
              <path d="M12 19l7-7 3 3-7 7-3-3z"/>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            </svg>
            crayon
          </button>

          <button class="tool-btn" id="toolPen" onclick="selectTool('pen')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
            </svg>
            Pen
          </button>

          <button class="tool-btn" id="toolRubber" onclick="selectTool('rubber')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5">
              <rect x="2" y="14" width="10" height="8" rx="2"/>
              <path d="M22 4l-4-2-12 12 4 4z"/>
            </svg>
            Rubber
          </button>

          <button class="tool-btn" id="toolPencil" onclick="selectTool('pencil')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5">
              <line x1="18" y1="2" x2="22" y2="6"/>
              <path d="M7.5 20.5L2 22l1.5-5.5L17 3l4 4z"/>
            </svg>
            Pencil
          </button>

          <!-- Mic Toggle Button -->
          <button class="tool-btn" id="micToggleBtn" onclick="toggleMic()" style="margin-top: 4px; border-color: #27ae60;">
            <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2.5">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span id="micLabel" style="color: #27ae60;">Mic On</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MediaPipe Face Mesh (loads model files from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/blob-panel.js"></script>
  <script src="js/multiplayer.js"></script>
  <script src="js/face-ar.js"></script>
  <script src="js/timer.js"></script>
  <script>
    let isMicOn = true;

    function toggleMic() {
      const localVideo = document.getElementById('localVideo');
      if (localVideo && localVideo.srcObject) {
        const audioTracks = localVideo.srcObject.getAudioTracks();
        if (audioTracks.length > 0) {
          isMicOn = !isMicOn;
          audioTracks[0].enabled = isMicOn;
          const label = document.getElementById('micLabel');
          const icon  = document.getElementById('micIcon');
          const btn   = document.getElementById('micToggleBtn');

          if (label) label.textContent = isMicOn ? 'Mic On' : 'Muted';
          if (label) label.style.color = isMicOn ? '#27ae60' : '#e74c3c';
          if (icon)  icon.setAttribute('stroke', isMicOn ? '#27ae60' : '#e74c3c');
          if (btn)   btn.style.borderColor = isMicOn ? '#27ae60' : '#e74c3c';
        }
      }
    }

    async function initWebcams() {
      const localVideo = document.getElementById('localVideo');
      const peerVideo  = document.getElementById('peerVideo');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = stream;

        if (window.PYBMultiplayer) {
          window.PYBMultiplayer.startVideoCall(stream);
        }
      } catch (err) {
        console.warn('[Play] Webcam not available, using mock feed:', err);
        createMockFeed(localVideo, 'You');
        createMockFeed(peerVideo, 'Peer');
        if (window.PYBMultiplayer) {
          window.PYBMultiplayer.startVideoCall(peerVideo.srcObject);
        }
      }
    }

    function createMockFeed(videoElem, label) {
      const c   = document.createElement('canvas');
      c.width = 640; c.height = 480;
      const ctx = c.getContext('2d');
      let f = 0;
      function animate() {
        f++;
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, 640, 480);
        // Head silhouette
        ctx.fillStyle = '#e8d5b7';
        ctx.beginPath();
        ctx.arc(320, 190 + Math.sin(f * 0.04) * 6, 110, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 4;
        ctx.stroke();
        // Rough face features
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(285, 175, 9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(355, 175, 9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(320, 215, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(320, 240, 18, 0, Math.PI); ctx.stroke();
        // Label
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, 320, 430);
        requestAnimationFrame(animate);
      }
      animate();
      videoElem.srcObject = c.captureStream(30);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomCode  = urlParams.get('code') || sessionStorage.getItem('roomCode') || '7608';
      const isHost    = sessionStorage.getItem('isHost') === 'true';

      // Fire webcam, multiplayer network connection, and AI face tracking simultaneously in parallel!
      const webcamPromise      = initWebcams();
      const multiplayerPromise = window.PYBMultiplayer ? window.PYBMultiplayer.init(roomCode, isHost, null, 'game') : Promise.resolve();
      const arPromise          = window.initFaceAR('drawingCanvas', 'peerVideo', 'localDrawingCanvas');

      await Promise.all([webcamPromise, multiplayerPromise, arPromise]);

      // Hide loading overlay once ready
      const overlay = document.getElementById('arLoadingOverlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(() => overlay.remove(), 400);
      }

      // Countdown timer
      const durationMins = parseInt(sessionStorage.getItem('durationMins') || '1', 10);
      startCountdownTimer(durationMins * 60, 'timerDisplay', () => {
        // Capture screenshot at last second of timer
        try {
          const peerVideo     = document.getElementById('peerVideo');
          const drawingCanvas = document.getElementById('drawingCanvas');
          const c1   = document.createElement('canvas');
          c1.width   = 640;
          c1.height  = 480;
          const ctx1 = c1.getContext('2d');

          if (peerVideo && peerVideo.readyState >= 2) {
            ctx1.drawImage(peerVideo, 0, 0, 640, 480);
          } else {
            ctx1.fillStyle = '#111';
            ctx1.fillRect(0, 0, 640, 480);
          }
          if (drawingCanvas) {
            ctx1.drawImage(drawingCanvas, 0, 0, 640, 480);
          }
          sessionStorage.setItem('pyb_last_snapshot_my_painting', c1.toDataURL('image/png'));

          const localVideo         = document.getElementById('localVideo');
          const localDrawingCanvas = document.getElementById('localDrawingCanvas');
          const c2   = document.createElement('canvas');
          c2.width   = 640;
          c2.height  = 480;
          const ctx2 = c2.getContext('2d');

          if (localVideo && localVideo.readyState >= 2) {
            ctx2.drawImage(localVideo, 0, 0, 640, 480);
          } else {
            ctx2.fillStyle = '#111';
            ctx2.fillRect(0, 0, 640, 480);
          }
          if (localDrawingCanvas) {
            ctx2.drawImage(localDrawingCanvas, 0, 0, 640, 480);
          }
          sessionStorage.setItem('pyb_last_snapshot_peer_painting', c2.toDataURL('image/png'));
        } catch (e) {
          console.warn('[Play] Screenshot capture failed:', e);
        }

        setTimeout(() => window.location.href = 'reveal.html', 400);
      });
    });
  </script>
</body>
</html>
