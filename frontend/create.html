<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Create Room</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-viewport bg-blossom-sky">
    <!-- Back Button Top-Left -->
    <a href="index.html" class="back-btn">Back</a>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 10;">
      <!-- Title Blob -->
      <div class="title-cloud-blob">Create</div>

      <!-- Main Cloud Panel -->
      <div class="blob-container create-room-panel">
        <!-- Option 1: No of Players -->
        <div class="option-row">
          <div class="option-label">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" filter="url(#sketchy-filter)">
              <circle cx="12" cy="8" r="5"/>
              <path d="M3 21v-2a7 7 0 0 1 14 0v2"/>
            </svg>
            No of Players
          </div>
          <div class="slider-wrapper">
            <span style="font-family: var(--font-title); font-size: 1.5rem;">1</span>
            <input type="range" min="1" max="4" value="2" class="custom-slider" id="playerSlider" oninput="document.getElementById('playerVal').innerText = this.value">
            <span style="font-family: var(--font-title); font-size: 1.5rem;" id="playerVal">2</span>
          </div>
        </div>

        <!-- Option 2: Duration -->
        <div class="option-row">
          <div class="option-label">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" filter="url(#sketchy-filter)">
              <circle cx="12" cy="12" r="9"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Duration
          </div>
          <div class="duration-boxes">
            <button class="dur-box active" onclick="selectDuration(this, 1)">1 min</button>
            <button class="dur-box" onclick="selectDuration(this, 5)">5 min</button>
            <button class="dur-box" onclick="selectDuration(this, 10)">10 min</button>
          </div>
        </div>

        <!-- Create Action Button -->
        <button onclick="handleCreateRoom()" class="blob-btn btn-green" style="font-size: 2rem; padding: 0.5rem 2.5rem; margin-top: 10px;">
          Create
        </button>
      </div>
    </div>
  </div>

  <script src="js/blob-panel.js"></script>
  <script>
    let selectedDuration = 1;

    function selectDuration(btn, mins) {
      document.querySelectorAll('.dur-box').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedDuration = mins;
    }

    function handleCreateRoom() {
      const playerCount = document.getElementById('playerSlider').value;
      const roomCode = Math.floor(1000 + Math.random() * 9000);
      sessionStorage.setItem('roomCode', roomCode);
      sessionStorage.setItem('maxPlayers', playerCount);
      sessionStorage.setItem('durationMins', selectedDuration);
      window.location.href = `room.html?code=${roomCode}`;
    }
  </script>
</body>
</html>
