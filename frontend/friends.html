<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Friends</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport bg-friends">
    <a href="user-menu.html" class="back-btn">↩</a>

    <div class="chalk-blob-torn friends-page-blob">
      <h2 style="font-family:var(--font-title); font-size:3rem; border-bottom:4px solid #111; padding-bottom:10px; margin-bottom:10px;">
        Friends
      </h2>

      <ul class="friends-list" id="friendsList"></ul>

      <!-- Add Friend button -->
      <button onclick="showAddFriend()" class="blob-btn btn-red" style="font-size:1.6rem; padding:0.3rem 1.8rem; margin-top:12px;">
        Add Friend
      </button>
    </div>
  </div>

  <!-- Add Friend Modal -->
  <div id="addFriendModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:999; align-items:center; justify-content:center; flex-direction:column;">
    <div style="background:white; border:6px solid #e74c3c; border-radius:20px; padding:2rem; min-width:300px; box-shadow: 6px 8px 0 #111; filter:url(#chalky);">
      <h3 style="font-family:var(--font-title); font-size:2.2rem; margin-bottom:1rem; color:#111;">ADD Friend</h3>
      <input id="friendUsernameInput" type="text" placeholder="username of friend"
        style="width:100%; font-family:var(--font-body); font-size:1.6rem; border:none; border-bottom:4px solid #111; background:transparent; outline:none; padding:4px 0; margin-bottom:16px;">
      <button onclick="addFriend()" class="blob-btn btn-green" style="font-size:1.8rem; width:100%;">
        ADD +
      </button>
    </div>
    <button onclick="closeAddFriend()" style="margin-top:16px; color:white; font-family:var(--font-body); font-size:1.4rem; background:none; border:none; cursor:pointer;">Cancel</button>
  </div>

  <script src="js/blob-panel.js"></script>
  <script>
    function renderFriends() {
      const friends = JSON.parse(localStorage.getItem('pyb_friends') || '[]');
      const list = document.getElementById('friendsList');
      list.innerHTML = '';
      if (friends.length === 0) {
        list.innerHTML = '<li style="font-family:var(--font-body);font-size:1.5rem;color:#aaa;">No friends yet. Add some!</li>';
        return;
      }
      friends.forEach((name, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <svg class="friend-stick-icon" viewBox="0 0 30 50" fill="none" stroke="#111" stroke-width="3">
            <circle cx="15" cy="10" r="8"/>
            <line x1="15" y1="18" x2="15" y2="35"/>
            <line x1="5" y1="24" x2="25" y2="24"/>
            <line x1="15" y1="35" x2="5" y2="48"/>
            <line x1="15" y1="35" x2="25" y2="48"/>
          </svg>
          <span>${name}</span>
          <button onclick="removeFriend(${idx})" style="margin-left:auto; background:none; border:none; cursor:pointer; font-size:1.5rem; color:#e74c3c;">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function showAddFriend() {
      const modal = document.getElementById('addFriendModal');
      modal.style.display = 'flex';
      document.getElementById('friendUsernameInput').focus();
    }

    function closeAddFriend() {
      document.getElementById('addFriendModal').style.display = 'none';
      document.getElementById('friendUsernameInput').value = '';
    }

    function addFriend() {
      const name = document.getElementById('friendUsernameInput').value.trim();
      if (!name) return;
      const friends = JSON.parse(localStorage.getItem('pyb_friends') || '[]');
      if (friends.includes(name)) { alert('Already in your friends list!'); return; }
      friends.push(name);
      localStorage.setItem('pyb_friends', JSON.stringify(friends));
      closeAddFriend();
      renderFriends();
    }

    function removeFriend(idx) {
      const friends = JSON.parse(localStorage.getItem('pyb_friends') || '[]');
      friends.splice(idx, 1);
      localStorage.setItem('pyb_friends', JSON.stringify(friends));
      renderFriends();
    }

    document.addEventListener('DOMContentLoaded', renderFriends);
  </script>
</body>
</html>
