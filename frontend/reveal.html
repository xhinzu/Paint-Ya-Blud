<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Reveal</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-viewport bg-tree-leaves">
    <!-- Back Button Top-Left -->
    <a href="index.html" class="back-btn">Back</a>

    <div class="reveal-viewport">
      <!-- Blue Crayon Heart "TIME OUT" Panel (Left) -->
      <div class="timeout-heart-panel">
        <div>TIME</div>
        <div>OUT</div>
      </div>

      <!-- Two Stacked Photo Frame Results (Right) -->
      <div class="results-frames-column">
        <!-- Player 1 Canvas Photo Frame -->
        <div class="result-photo-frame">
          <canvas id="resultCanvas1" width="320" height="240"></canvas>
        </div>

        <!-- Player 2 Canvas Photo Frame -->
        <div class="result-photo-frame">
          <canvas id="resultCanvas2" width="320" height="240"></canvas>
        </div>
      </div>
    </div>

    <!-- START Rematch Button (Bottom-Left) -->
    <a href="play.html" class="blob-btn btn-green" style="position: absolute; bottom: 35px; left: 35px; font-size: 2.2rem; padding: 0.5rem 2.5rem; z-index: 100;">
      START
    </a>
  </div>

  <script src="js/blob-panel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Draw result canvas 1 (Peer with devil horns)
      const c1 = document.getElementById('resultCanvas1');
      const ctx1 = c1.getContext('2d');
      ctx1.fillStyle = '#222';
      ctx1.fillRect(0, 0, 320, 240);
      
      // Face
      ctx1.fillStyle = '#ffeaa7';
      ctx1.beginPath();
      ctx1.arc(160, 120, 60, 0, Math.PI * 2);
      ctx1.fill();

      // Red devil horns
      ctx1.fillStyle = '#e74c3c';
      ctx1.beginPath();
      ctx1.moveTo(120, 75); ctx1.quadraticCurveTo(100, 30, 115, 30); ctx1.quadraticCurveTo(130, 50, 135, 70);
      ctx1.fill();
      ctx1.beginPath();
      ctx1.moveTo(200, 75); ctx1.quadraticCurveTo(220, 30, 205, 30); ctx1.quadraticCurveTo(190, 50, 185, 70);
      ctx1.fill();

      // Red nose
      ctx1.fillStyle = '#e74c3c';
      ctx1.beginPath(); ctx1.arc(160, 125, 12, 0, Math.PI * 2); ctx1.fill();

      // Draw result canvas 2 (Local user with clown hair)
      const c2 = document.getElementById('resultCanvas2');
      const ctx2 = c2.getContext('2d');
      const drawnData = sessionStorage.getItem('drawnCanvasData');

      if (drawnData) {
        const img = new Image();
        img.onload = () => ctx2.drawImage(img, 0, 0, 320, 240);
        img.src = drawnData;
      } else {
        ctx2.fillStyle = '#222';
        ctx2.fillRect(0, 0, 320, 240);
        ctx2.fillStyle = '#ffeaa7';
        ctx2.beginPath(); ctx2.arc(160, 120, 60, 0, Math.PI * 2); ctx2.fill();
        // Orange clown wig
        ctx2.strokeStyle = '#e67e22';
        ctx2.lineWidth = 8;
        ctx2.beginPath();
        ctx2.arc(160, 110, 75, Math.PI * 0.8, Math.PI * 2.2);
        ctx2.stroke();
        // Red nose
        ctx2.fillStyle = '#e74c3c';
        ctx2.beginPath(); ctx2.arc(160, 125, 14, 0, Math.PI * 2); ctx2.fill();
      }
    });
  </script>
</body>
</html>
