<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Reveal</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body, html { overflow: hidden; }

    .reveal-video-container {
      position: relative;
      width: 320px;
      height: 230px;
      border: 5px solid #e74c3c;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 4px 5px 0 #111;
      background: #111;
    }

    .reveal-video-container video,
    .reveal-video-container canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .reveal-video-container canvas {
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport bg-reveal">
    <!-- Back button -->
    <a href="index.html" class="back-btn">↩</a>

    <div class="reveal-layout">
      <!-- TIME OUT heart -->
      <div class="timeout-heart">
        <span>TIME</span>
        <span>OUT</span>
      </div>

      <!-- Two result frames with live webcams & AR face paint -->
      <div class="results-frame-wrap">
        <!-- Top Frame: Peer's live face with your AR paint -->
        <div class="reveal-video-container">
          <video id="peerVideo" autoplay playsinline></video>
          <canvas id="arCanvasPeer"></canvas>
        </div>

        <!-- Bottom Frame: Your live face (PIP) -->
        <div class="reveal-video-container" style="border-color: #27ae60;">
          <video id="localVideo" autoplay playsinline muted></video>
          <canvas id="arCanvasLocal"></canvas>
        </div>
      </div>
    </div>

    <!-- START Rematch Button -->
    <div class="reveal-start-btn">
      <button onclick="handleRematch()" class="blob-btn btn-green" id="startRematchBtn" style="font-size:2rem; padding:0.4rem 2rem;">
        START
      </button>
    </div>
  </div>

  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/blob-panel.js"></script>
  <script src="js/multiplayer.js"></script>
  <script src="js/face-ar.js"></script>
  <script>
    let isHost   = false;
    let roomCode = '7608';

    async function initWebcams() {
      const localVideo = document.getElementById('localVideo');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = stream;

        if (window.PYBMultiplayer) {
          window.PYBMultiplayer.startVideoCall(stream);
        }
      } catch (err) {
        console.warn('[Reveal] Webcams not available:', err);
      }
    }

    function handleRematch() {
      if (isHost && window.PYBMultiplayer) {
        window.PYBMultiplayer.triggerStartGame();
      } else if (isHost) {
        window.location.href = `play.html?code=${roomCode}`;
      } else {
        alert('Waiting for the host to start next round!');
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      roomCode = urlParams.get('code') || sessionStorage.getItem('roomCode') || '7608';
      isHost   = sessionStorage.getItem('isHost') === 'true';

      const startBtn = document.getElementById('startRematchBtn');
      if (!isHost && startBtn) {
        startBtn.innerText = 'Waiting...';
        startBtn.style.opacity = '0.6';
      }

      // 1. Init Multiplayer (reveal phase)
      if (window.PYBMultiplayer) {
        await window.PYBMultiplayer.init(roomCode, isHost, null, 'reveal');
      }

      // 2. Start webcams & live voice chat
      await initWebcams();

      // 3. Init AR face tracking on peer video frame
      await window.initFaceAR('arCanvasPeer', 'peerVideo');

      // 4. Restore saved AR face paint strokes so drawing stays pinned to their face!
      try {
        const savedStrokes = JSON.parse(sessionStorage.getItem('pyb_saved_ar_strokes') || '[]');
        if (savedStrokes.length > 0 && window.setARStrokes) {
          window.setARStrokes(savedStrokes);
        }
      } catch (_) {}
    });
  </script>
</body>
</html>
