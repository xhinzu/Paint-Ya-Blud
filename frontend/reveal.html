<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Reveal</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-viewport bg-tree-leaves">
    <!-- Back Button Top-Left -->
    <a href="index.html" class="back-btn">Back</a>

    <div class="reveal-viewport">
      <!-- Blue Crayon Heart "TIME OUT" Panel (Left) -->
      <div class="timeout-heart-panel">
        <div>TIME</div>
        <div>OUT</div>
      </div>

      <!-- Two Stacked Photo Frame Results (Right) -->
      <div class="results-frames-column">
        <!-- Player 1 / Peer Canvas Photo Frame -->
        <div class="result-photo-frame">
          <canvas id="resultCanvas1" width="320" height="240"></canvas>
        </div>

        <!-- Player 2 / Local Canvas Photo Frame -->
        <div class="result-photo-frame">
          <canvas id="resultCanvas2" width="320" height="240"></canvas>
        </div>
      </div>
    </div>

    <!-- START Rematch Button (Bottom-Left) -->
    <a href="play.html" class="blob-btn btn-green" style="position: absolute; bottom: 35px; left: 35px; font-size: 2.2rem; padding: 0.5rem 2.5rem; z-index: 100;">
      START
    </a>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/blob-panel.js"></script>
  <script src="js/multiplayer.js"></script>
  <script>
    function renderCanvasData(canvasId, dataUrl, defaultDraw) {
      const c = document.getElementById(canvasId);
      if (!c) return;
      const ctx = c.getContext('2d');

      if (dataUrl) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, 320, 240);
          ctx.drawImage(img, 0, 0, 320, 240);
        };
        img.src = dataUrl;
      } else if (defaultDraw) {
        defaultDraw(ctx);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomCode = urlParams.get('code') || sessionStorage.getItem('roomCode') || '7608';
      const isHost = sessionStorage.getItem('isHost') === 'true';

      if (window.PYBMultiplayer) {
        await window.PYBMultiplayer.init(roomCode, isHost);
      }

      window.onRemoteCanvasResult = function (remoteDataUrl) {
        sessionStorage.setItem('remoteCanvasData', remoteDataUrl);
        renderCanvasData('resultCanvas1', remoteDataUrl);
      };

      // Draw Canvas 1 (Peer Artwork)
      const remoteData = sessionStorage.getItem('remoteCanvasData');
      renderCanvasData('resultCanvas1', remoteData, (ctx1) => {
        ctx1.fillStyle = '#222';
        ctx1.fillRect(0, 0, 320, 240);
        ctx1.fillStyle = '#ffeaa7';
        ctx1.beginPath(); ctx1.arc(160, 120, 60, 0, Math.PI * 2); ctx1.fill();
        ctx1.fillStyle = '#e74c3c';
        ctx1.beginPath();
        ctx1.moveTo(120, 75); ctx1.quadraticCurveTo(100, 30, 115, 30); ctx1.quadraticCurveTo(130, 50, 135, 70); ctx1.fill();
        ctx1.beginPath();
        ctx1.moveTo(200, 75); ctx1.quadraticCurveTo(220, 30, 205, 30); ctx1.quadraticCurveTo(190, 50, 185, 70); ctx1.fill();
        ctx1.fillStyle = '#e74c3c';
        ctx1.beginPath(); ctx1.arc(160, 125, 12, 0, Math.PI * 2); ctx1.fill();
      });

      // Draw Canvas 2 (Local Artwork)
      const localData = sessionStorage.getItem('drawnCanvasData');
      renderCanvasData('resultCanvas2', localData, (ctx2) => {
        ctx2.fillStyle = '#222';
        ctx2.fillRect(0, 0, 320, 240);
        ctx2.fillStyle = '#ffeaa7';
        ctx2.beginPath(); ctx2.arc(160, 120, 60, 0, Math.PI * 2); ctx2.fill();
        ctx2.strokeStyle = '#e67e22';
        ctx2.lineWidth = 8;
        ctx2.beginPath(); ctx2.arc(160, 110, 75, Math.PI * 0.8, Math.PI * 2.2); ctx2.stroke();
        ctx2.fillStyle = '#e74c3c';
        ctx2.beginPath(); ctx2.arc(160, 125, 14, 0, Math.PI * 2); ctx2.fill();
      });
    });
  </script>
</body>
</html>
