<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Paint Ya Blud - Reveal</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    body, html { overflow: hidden; }

    .reveal-img-container {
      position: relative;
      width: 320px;
      height: 230px;
      border: 5px solid #e74c3c;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 4px 5px 0 #111;
      background: #111;
    }

    .reveal-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-badge {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: #e74c3c;
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      box-shadow: 2px 2px 0 #111;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport bg-reveal">
    <!-- Back button -->
    <a href="index.html" class="back-btn">↩</a>

    <div class="reveal-layout">
      <!-- TIME OUT heart -->
      <div class="timeout-heart">
        <span>TIME</span>
        <span>OUT</span>
      </div>

      <!-- Two captured screenshot result frames -->
      <div class="results-frame-wrap">
        <!-- Top Frame: Image of what YOU painted on your friend -->
        <div class="reveal-img-container">
          <img id="resultSnapshot1" src="" alt="What you painted on your friend" style="background:#111;" />
          <div class="result-badge">YOU PAINTED THIS</div>
        </div>

        <!-- Bottom Frame: Image of what YOUR FRIEND painted on you -->
        <div class="reveal-img-container" style="border-color: #27ae60;">
          <img id="resultSnapshot2" src="" alt="What was painted on you" style="background:#111;" />
          <div class="result-badge" style="background: #27ae60;">PAINTED ON YOU</div>
        </div>
      </div>
    </div>

    <!-- START Rematch Button -->
    <div class="reveal-start-btn">
      <button onclick="handleRematch()" class="blob-btn btn-green" id="startRematchBtn" style="font-size:2rem; padding:0.4rem 2rem;">
        START
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/blob-panel.js"></script>
  <script src="js/multiplayer.js"></script>
  <script>
    let isHost   = false;
    let roomCode = '7608';

    function handleRematch() {
      if (isHost && window.PYBMultiplayer) {
        window.PYBMultiplayer.triggerStartGame();
      } else if (isHost) {
        const dur   = sessionStorage.getItem('durationMins') || '1';
        const t     = Date.now();
        sessionStorage.setItem('pyb_game_start_time', String(t));
        window.location.href = `play.html?code=${roomCode}&duration=${dur}&t=${t}`;
      } else {
        alert('Waiting for the host to start next round!');
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      roomCode = urlParams.get('code') || sessionStorage.getItem('roomCode') || '7608';
      isHost   = sessionStorage.getItem('isHost') === 'true';

      const startBtn = document.getElementById('startRematchBtn');
      if (!isHost && startBtn) {
        startBtn.innerText = 'Waiting...';
        startBtn.style.opacity = '0.6';
      }

      // Load captured screenshot images from the final second of the timer
      const snap1 = sessionStorage.getItem('pyb_last_snapshot_my_painting');
      const snap2 = sessionStorage.getItem('pyb_last_snapshot_peer_painting');

      const img1 = document.getElementById('resultSnapshot1');
      const img2 = document.getElementById('resultSnapshot2');

      if (img1 && snap1) img1.src = snap1;
      if (img2 && snap2) img2.src = snap2;

      // Init multiplayer in reveal phase so host can signal START for next match
      if (window.PYBMultiplayer) {
        await window.PYBMultiplayer.init(roomCode, isHost, null, 'reveal');
      }
    });
  </script>
  <script src="js/mobile.js"></script>
</body>
</html>
