<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Reveal</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport bg-reveal">
    <!-- Back button -->
    <a href="index.html" class="back-btn">↩</a>

    <div class="reveal-layout">
      <!-- TIME OUT heart -->
      <div class="timeout-heart">
        <span>TIME</span>
        <span>OUT</span>
      </div>

      <!-- Two stacked result frames -->
      <div class="results-frame-wrap">
        <div class="result-canvas-frame">
          <canvas id="resultCanvas1" width="300" height="220"></canvas>
        </div>
        <div class="result-canvas-frame">
          <canvas id="resultCanvas2" width="300" height="220"></canvas>
        </div>
      </div>
    </div>

    <!-- START Rematch -->
    <div class="reveal-start-btn">
      <a href="play.html" class="blob-btn btn-green" style="font-size:2rem; padding:0.4rem 2rem;">
        START
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/blob-panel.js"></script>
  <script src="js/multiplayer.js"></script>
  <script>
    function drawCanvas(canvasId, dataUrl, fallback) {
      const c = document.getElementById(canvasId);
      if (!c) return;
      const ctx = c.getContext('2d');
      if (dataUrl) {
        const img = new Image();
        img.onload = () => { ctx.clearRect(0,0,300,220); ctx.drawImage(img,0,0,300,220); };
        img.src = dataUrl;
      } else if (fallback) fallback(ctx);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const roomCode = sessionStorage.getItem('roomCode') || '7608';
      const isHost   = sessionStorage.getItem('isHost') === 'true';

      if (window.PYBMultiplayer) {
        await window.PYBMultiplayer.init(roomCode, isHost);
      }

      window.onRemoteCanvasResult = function(url) {
        sessionStorage.setItem('remoteCanvasData', url);
        drawCanvas('resultCanvas1', url);
      };

      const remoteData = sessionStorage.getItem('remoteCanvasData');
      const localData  = sessionStorage.getItem('drawnCanvasData');

      // Canvas 1: Peer's artwork
      drawCanvas('resultCanvas1', remoteData, (ctx) => {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0,0,300,220);
        ctx.fillStyle = '#f0c8a0';
        ctx.beginPath(); ctx.arc(150,100,55,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.moveTo(115,70); ctx.quadraticCurveTo(95,30,110,30); ctx.quadraticCurveTo(125,45,130,65); ctx.fill();
        ctx.beginPath(); ctx.moveTo(185,70); ctx.quadraticCurveTo(205,30,190,30); ctx.quadraticCurveTo(175,45,170,65); ctx.fill();
        ctx.beginPath(); ctx.arc(150,108,11,0,Math.PI*2); ctx.fill();
      });

      // Canvas 2: Your artwork
      drawCanvas('resultCanvas2', localData, (ctx) => {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0,0,300,220);
        ctx.fillStyle = '#f0c8a0';
        ctx.beginPath(); ctx.arc(150,100,55,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.arc(150,90,70,Math.PI*0.75,Math.PI*2.25); ctx.stroke();
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath(); ctx.arc(150,110,13,0,Math.PI*2); ctx.fill();
      });
    });
  </script>
</body>
</html>
