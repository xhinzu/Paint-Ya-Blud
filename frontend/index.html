<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Global SVG Filters -->
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport bg-main-menu">

    <!-- USER button top-right -->
    <a href="user-menu.html" class="user-icon-btn">
      USER
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>

    <!-- Rainbow Title -->
    <div class="main-title-area">
      <h1 class="rainbow-title">
        <span>P</span><span>a</span><span>i</span><span>n</span><span>t</span>
        <span>&nbsp;</span>
        <span>y</span><span>a</span>
        <span>&nbsp;</span>
        <span>B</span><span>L</span><span>U</span><span>D</span>
      </h1>
    </div>

    <!-- Menu Buttons Left -->
    <div class="menu-buttons-stack">
      <a href="create.html" class="blob-btn btn-green">create</a>
      <a href="join.html"   class="blob-btn btn-orange">join</a>
      <button onclick="if(confirm('Quit Paint Ya Blud?')) window.close()" class="blob-btn btn-red">quit</button>
    </div>

    <!-- Mascot Stick Figure Right -->
    <div class="mascot-area">
      <canvas id="mascotCanvas" width="320" height="420"></canvas>
    </div>

  </div>

  <script src="js/blob-panel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      drawStickMascot('mascotCanvas', { headY: 110, headRadius: 70, lineWidth: 7 });
    });
  </script>
</body>
</html>
