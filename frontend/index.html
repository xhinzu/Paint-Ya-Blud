<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Welcome Username Modal Overlay */
    #usernameModalOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .username-modal-blob {
      background: rgba(255, 255, 255, 0.98);
      border: 6px solid #111;
      border-radius: 42% 58% 50% 50% / 55% 45% 55% 45%;
      padding: 2.5rem 3rem;
      box-shadow: 6px 8px 0 #111;
      filter: url(#chalky);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .username-modal-title {
      font-family: var(--font-title);
      font-size: 2.2rem;
      color: var(--color-green);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
      line-height: 1.2;
    }

    .username-input-field {
      width: 100%;
      font-family: var(--font-title);
      font-size: 1.8rem;
      text-align: center;
      border: none;
      border-bottom: 4px solid #111;
      background: transparent;
      outline: none;
      padding: 8px 0;
      color: #111;
    }

    .username-input-field::placeholder {
      color: #aaa;
      font-family: var(--font-body);
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <!-- Global SVG Filters -->
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- Welcome Username Modal (Only for new players) -->
  <div id="usernameModalOverlay" style="display: none;">
    <div class="username-modal-blob">
      <div class="username-modal-title">Enter your username</div>
      <input type="text" id="usernameInput" class="username-input-field" placeholder="username" maxlength="15" autofocus
        onkeydown="if(event.key==='Enter') submitUsername()">
      <button onclick="submitUsername()" class="blob-btn btn-green" style="font-size: 2rem; padding: 0.4rem 2.5rem; width: 100%; margin-top: 8px;">
        LET'S GO
      </button>
    </div>
  </div>

  <div class="app-viewport bg-main-menu">

    <!-- USER button top-right -->
    <a href="user-menu.html" class="user-icon-btn">
      <span id="userBtnLabel">USER</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>

    <!-- Rainbow Title -->
    <div class="main-title-area">
      <h1 class="rainbow-title">
        <span>P</span><span>a</span><span>i</span><span>n</span><span>t</span>
        <span>&nbsp;</span>
        <span>y</span><span>a</span>
        <span>&nbsp;</span>
        <span>B</span><span>L</span><span>U</span><span>D</span>
      </h1>
    </div>

    <!-- Menu Buttons Left -->
    <div class="menu-buttons-stack">
      <a href="create.html" class="blob-btn btn-green">create</a>
      <a href="join.html"   class="blob-btn btn-orange">join</a>
      <button onclick="if(confirm('Quit Paint Ya Blud?')) window.close()" class="blob-btn btn-red">quit</button>
    </div>

    <!-- Mascot Stick Figure Right -->
    <div class="mascot-area">
      <canvas id="mascotCanvas" width="520" height="640"></canvas>
    </div>

  </div>

  <script src="js/blob-panel.js"></script>
  <script>
    function submitUsername() {
      const input = document.getElementById('usernameInput');
      const name = input.value.trim();
      if (!name) {
        alert('Please enter a username!');
        return;
      }
      localStorage.setItem('pyb_username', name);
      document.getElementById('userBtnLabel').textContent = name;
      document.getElementById('usernameModalOverlay').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Check if player has username saved
      const savedName = localStorage.getItem('pyb_username');
      if (!savedName || !savedName.trim()) {
        document.getElementById('usernameModalOverlay').style.display = 'flex';
        setTimeout(() => document.getElementById('usernameInput').focus(), 100);
      } else {
        document.getElementById('userBtnLabel').textContent = savedName;
      }

      drawStickMascot('mascotCanvas');
    });
  </script>
</body>
</html>
