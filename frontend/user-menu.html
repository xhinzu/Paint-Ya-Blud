<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - User</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport bg-user-menu">
    <a href="index.html" class="back-btn">↩</a>

    <div class="user-menu-layout">
      <!-- Stick figure mascot on left -->
      <canvas id="userMascot" class="user-mascot-canvas" width="260" height="320"></canvas>

      <!-- Info blob on right -->
      <div class="chalk-blob user-menu-panel">
        <!-- Username -->
        <div class="user-menu-item" style="align-items:flex-start; flex-direction:column; gap:4px;">
          <span style="font-size:1.4rem; color:#888;">username</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <span id="usernameDisplay" style="font-size:2rem;">Player</span>
            <button onclick="editUsername()" style="background:none;border:none;cursor:pointer;font-size:1.4rem;">✏️</button>
          </div>
        </div>

        <!-- Friends count -->
        <a href="friends.html" class="user-menu-item">
          friends
          <span id="friendCount" style="color:var(--color-blue);">[0]</span>
        </a>

        <!-- Edit Stick -->
        <a href="edit-stick.html" class="user-menu-item">
          [Edit Your Stick]
        </a>

        <!-- Log Out -->
        <div class="user-menu-item danger" onclick="handleLogout()">
          Log Out
        </div>
      </div>
    </div>
  </div>

  <script src="js/blob-panel.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const username = localStorage.getItem('pyb_username') || 'Player';
      document.getElementById('usernameDisplay').innerText = username;

      const friends = JSON.parse(localStorage.getItem('pyb_friends') || '[]');
      document.getElementById('friendCount').innerText = `[${friends.length}]`;

      drawStickMascot('userMascot', { headY: 90, headRadius: 55, lineWidth: 5 });
    });

    function editUsername() {
      const newName = prompt('Enter your username:', localStorage.getItem('pyb_username') || 'Player');
      if (newName && newName.trim()) {
        localStorage.setItem('pyb_username', newName.trim());
        document.getElementById('usernameDisplay').innerText = newName.trim();
      }
    }

    function handleLogout() {
      if (confirm('Log out of Paint Ya Blud?')) {
        localStorage.removeItem('pyb_username');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
