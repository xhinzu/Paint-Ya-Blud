<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paint Ya Blud - Edit Your Stick</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .edit-bg {
      background-image: url('css/bg_edit_stick.png');
      background-size: cover;
      background-position: center;
    }

    .editor-root {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Left arrow column */
    .arrows-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 0 20px;
    }

    /* Each arrow button is a hand-drawn chevron */
    .arrow-btn {
      font-family: var(--font-title);
      font-size: 3.2rem;
      color: #111;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.7);
      transition: transform 0.1s, text-shadow 0.1s;
      user-select: none;
      -webkit-text-stroke: 1px rgba(0,0,0,0.1);
      /* Crayon sketch look */
      filter: url(#chalky);
    }

    .arrow-btn:hover {
      transform: scale(1.2);
      text-shadow: 3px 3px 0 rgba(255,255,255,0.9);
    }

    .arrow-btn:active {
      transform: scale(0.9);
    }

    /* Feature labels between arrows */
    .feature-label {
      font-family: var(--font-body);
      font-size: 1rem;
      color: rgba(255,255,255,0.85);
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
      margin-top: -18px;
      pointer-events: none;
    }

    /* Center canvas + title */
    .character-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .page-title {
      font-family: var(--font-title);
      font-size: 2.8rem;
      color: #111;
      text-shadow: 2px 2px 0 white, -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white;
      text-align: center;
    }

    #customizerCanvas {
      filter: drop-shadow(3px 5px 0 rgba(0,0,0,0.3));
      border-radius: 8px;
    }

    /* Save / back buttons below character */
    .save-row {
      display: flex;
      gap: 14px;
      margin-top: 6px;
    }

    /* Current option label bubble */
    .option-chip {
      font-family: var(--font-body);
      font-size: 1.1rem;
      background: rgba(255,255,255,0.9);
      border: 2px solid #111;
      border-radius: 20px;
      padding: 2px 12px;
      color: #111;
      text-align: center;
      min-width: 80px;
    }

    /* Labels column beside arrows */
    .labels-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <svg id="globalFilters" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="chalky" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="app-viewport edit-bg">
    <a href="user-menu.html" class="back-btn">↩</a>

    <div class="editor-root">

      <!-- LEFT arrows column -->
      <div class="arrows-col" id="leftArrows">
        <!-- Generated by JS -->
      </div>

      <!-- Center: title + canvas + save -->
      <div class="character-center">
        <div class="page-title">Edit Your Stick</div>
        <canvas id="customizerCanvas" width="300" height="420"></canvas>
        <div class="save-row">
          <button onclick="saveCharacter()" class="blob-btn btn-green" style="font-size:1.6rem; padding:0.4rem 1.8rem;">
            Save ✓
          </button>
          <a href="user-menu.html" class="blob-btn btn-red" style="font-size:1.6rem; padding:0.4rem 1.8rem;">
            Back
          </a>
        </div>
      </div>

      <!-- RIGHT arrows column -->
      <div class="arrows-col" id="rightArrows">
        <!-- Generated by JS -->
      </div>

    </div>
  </div>

  <script src="js/blob-panel.js"></script>
  <script>
    /* ==================== */
    /* CUSTOMIZATION STATE  */
    /* ==================== */

    const features = [
      {
        key:     'hat',
        label:   'Hat',
        options: ['None', 'Top Hat', 'Beanie', 'Halo', 'Crown'],
        idx:     0
      },
      {
        key:     'face',
        label:   'Mood',
        options: ['Happy','Angry','Confused','Shocked','Flirty','Tired','Cool','Smug','Crying','Nervous','Scared','Laughing'],
        idx:     0
      },
      {
        key:     'skin',
        label:   'Skin',
        options: ['Default', 'Peach', 'Tan', 'Dark', 'Purple'],
        idx:     0
      },
      {
        key:     'tie',
        label:   'Tie',
        options: ['Red', 'Blue', 'Green', 'Yellow', 'Purple', 'Orange', 'None'],
        idx:     0
      }
    ];

    const skinFills = ['transparent', '#f5cba7', '#e59866', '#6e2d0e', '#8e44ad'];
    const tieColors = ['#e74c3c', '#2980b9', '#27ae60', '#f1c40f', '#9b59b6', '#e67e22', null];

    /* ==================== */
    /*   BUILD ARROW UI     */
    /* ==================== */

    function buildArrows() {
      const left  = document.getElementById('leftArrows');
      const right = document.getElementById('rightArrows');
      left.innerHTML  = '';
      right.innerHTML = '';

      features.forEach((feat, fi) => {
        // Left: previous arrow + feature label + current value chip
        const lWrap = document.createElement('div');
        lWrap.style.display = 'flex';
        lWrap.style.flexDirection = 'column';
        lWrap.style.alignItems = 'center';
        lWrap.style.gap = '4px';

        const lBtn = document.createElement('button');
        lBtn.className = 'arrow-btn';
        lBtn.innerHTML = '‹';
        lBtn.onclick = () => { cycle(fi, -1); };

        const chip = document.createElement('div');
        chip.className = 'option-chip';
        chip.id = `chip_${feat.key}`;
        chip.textContent = feat.options[feat.idx];

        const labelEl = document.createElement('div');
        labelEl.className = 'feature-label';
        labelEl.textContent = feat.label;

        lWrap.appendChild(lBtn);
        lWrap.appendChild(chip);
        lWrap.appendChild(labelEl);
        left.appendChild(lWrap);

        // Right: next arrow
        const rBtn = document.createElement('button');
        rBtn.className = 'arrow-btn';
        rBtn.innerHTML = '›';
        rBtn.onclick = () => { cycle(fi, 1); };

        const rWrap = document.createElement('div');
        rWrap.style.display = 'flex';
        rWrap.style.flexDirection = 'column';
        rWrap.style.alignItems = 'center';
        rWrap.style.gap = '4px';
        rWrap.style.marginTop = `${28 * 0}px`;

        // Spacer to align with left
        const rSpacer = document.createElement('div');
        rSpacer.style.height = '0';

        rWrap.appendChild(rBtn);
        right.appendChild(rWrap);
      });
    }

    function cycle(featureIdx, dir) {
      const f = features[featureIdx];
      f.idx = (f.idx + dir + f.options.length) % f.options.length;
      document.getElementById(`chip_${f.key}`).textContent = f.options[f.idx];
      render();
    }

    /* ==================== */
    /*   CANVAS RENDERING   */
    /* ==================== */

    function render() {
      const canvas = document.getElementById('customizerCanvas');
      const ctx    = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const cx     = w / 2;
      const headR  = 78;
      const headY  = 110;
      const hat    = features[0].options[features[0].idx];
      const mood   = features[1].options[features[1].idx];
      const skin   = features[2].idx;
      const tieIdx = features[3].idx;

      ctx.lineCap  = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth   = 6;
      ctx.strokeStyle = '#111';

      /* --- Skin fill --- */
      const fillColor = skinFills[skin];

      /* --- Hat (drawn behind head) --- */
      drawHat(ctx, cx, headY, headR, hat, true /* behind */);

      /* --- Head --- */
      ctx.fillStyle = fillColor;
      ctx.beginPath();
      ctx.arc(cx, headY, headR, 0, Math.PI * 2);
      if (skin > 0) ctx.fill();
      ctx.stroke();

      /* --- Hat (drawn on top of head) --- */
      drawHat(ctx, cx, headY, headR, hat, false /* front */);

      /* --- Eyes, Brows, Nose, Mouth --- */
      drawFace(ctx, cx, headY, headR, mood);

      /* --- Body torso --- */
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#111';
      ctx.fillStyle = fillColor;

      ctx.beginPath();
      ctx.moveTo(cx - headR * 0.7, h - 5);
      ctx.quadraticCurveTo(cx - headR * 0.88, headY + headR + 16, cx, headY + headR + 10);
      ctx.quadraticCurveTo(cx + headR * 0.88, headY + headR + 16, cx + headR * 0.7, h - 5);

      if (skin > 0) ctx.fill();
      ctx.stroke();

      /* --- Tie / scarf --- */
      const tieColor = tieColors[tieIdx];
      if (tieColor) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#111';
        ctx.fillStyle = tieColor;
        ctx.beginPath();
        ctx.moveTo(cx - 10, headY + headR + 10);
        ctx.lineTo(cx + 10, headY + headR + 10);
        ctx.lineTo(cx + 17, headY + headR + 70);
        ctx.lineTo(cx,      headY + headR + 100);
        ctx.lineTo(cx - 17, headY + headR + 70);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.lineWidth = 6;
      ctx.strokeStyle = '#111';
    }

    /* ==================== */
    /*   FACE / MOOD DRAW   */
    /* ==================== */

    function drawFace(ctx, cx, headY, headR, mood) {
      const ex = headR * 0.33; // eye X offset from center
      const ey = headR * 0.14; // eye Y offset up from center
      const browY = headY - ey - 22; // base brow Y

      ctx.strokeStyle = '#111';
      ctx.fillStyle   = '#111';

      // ---- Helper shortcuts ----
      function dot(x, y, r) {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      function line(x1,y1,x2,y2, w) {
        ctx.lineWidth = w || 4.5;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.lineWidth = 6;
      }
      function arc(x,y,r,s,e,ccw) {
        ctx.beginPath(); ctx.arc(x,y,r,s,e,ccw); ctx.stroke();
      }

      ctx.lineWidth = 4.5;

      switch(mood) {

        case 'Happy': // smile, curved brows, dot eyes
          dot(cx - ex, headY - ey, 7);
          dot(cx + ex, headY - ey, 7);
          arc(cx - ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          arc(cx + ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          dot(cx, headY + headR*0.16, 4); // nose
          ctx.lineWidth = 5;
          arc(cx, headY + 14, headR*0.42, Math.PI*0.15, Math.PI*0.85);
          break;

        case 'Angry': // thick furrowed brows pointing in, frown, small eyes
          dot(cx - ex, headY - ey, 7);
          dot(cx + ex, headY - ey, 7);
          // Angry brows: diagonal inward-down
          line(cx - ex - 18, browY - 8,  cx - ex + 10, browY + 8,  5);
          line(cx + ex + 18, browY - 8,  cx + ex - 10, browY + 8,  5);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          // Frown
          arc(cx, headY + 55, headR*0.42, Math.PI*1.15, Math.PI*1.85);
          // Wrinkle between brows
          line(cx - 5, browY + 5, cx + 5, browY - 2, 3.5);
          break;

        case 'Confused': // tilted brows, wavy mouth, one raised brow
          dot(cx - ex, headY - ey, 7);
          dot(cx + ex, headY - ey, 7);
          // Left brow raised, right flat
          ctx.lineWidth = 4.5;
          arc(cx - ex, browY - 6, 13, Math.PI*1.1, Math.PI*1.9);
          line(cx + ex - 14, browY + 2, cx + ex + 14, browY + 2, 4.5);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          // Wavy / squiggly mouth
          ctx.beginPath();
          ctx.moveTo(cx - 22, headY + 20);
          ctx.bezierCurveTo(cx - 10, headY + 10, cx + 10, headY + 30, cx + 22, headY + 20);
          ctx.stroke();
          break;

        case 'Shocked': // wide circle eyes, O mouth
          ctx.lineWidth = 4;
          arc(cx - ex, headY - ey, 12, 0, Math.PI*2);
          arc(cx + ex, headY - ey, 12, 0, Math.PI*2);
          dot(cx - ex, headY - ey, 4);
          dot(cx + ex, headY - ey, 4);
          arc(cx - ex, browY + 2, 11, Math.PI*1.1, Math.PI*1.9);
          arc(cx + ex, browY + 2, 11, Math.PI*1.1, Math.PI*1.9);
          dot(cx, headY + headR*0.16, 4);
          ctx.fillStyle = '#111';
          ctx.beginPath(); ctx.ellipse(cx, headY + 24, 11, 16, 0, 0, Math.PI*2); ctx.fill();
          break;

        case 'Flirty': // heavy-lashed half-closed eyes, tongue out
          // Eyes: half-closed with lashes
          ctx.lineWidth = 4;
          arc(cx - ex, headY - ey + 2, 12, Math.PI*1.0, Math.PI*2.0); // bottom half
          arc(cx + ex, headY - ey + 2, 12, Math.PI*1.0, Math.PI*2.0);
          // Lashes top
          for (let i = -2; i <= 2; i++) {
            const lx = cx - ex + i * 5;
            line(lx, headY - ey - 10, lx + (i < 0 ? -2 : i > 0 ? 2 : 0), headY - ey - 18, 2.5);
          }
          for (let i = -2; i <= 2; i++) {
            const lx = cx + ex + i * 5;
            line(lx, headY - ey - 10, lx + (i < 0 ? -2 : i > 0 ? 2 : 0), headY - ey - 18, 2.5);
          }
          // Curved lash line
          ctx.lineWidth = 4;
          arc(cx - ex, headY - ey - 10, 12, Math.PI, Math.PI*2);
          arc(cx + ex, headY - ey - 10, 12, Math.PI, Math.PI*2);
          // Brow
          arc(cx - ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          arc(cx + ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          dot(cx, headY + headR*0.16, 4);
          // Smile + tongue
          ctx.lineWidth = 5;
          arc(cx, headY + 10, headR*0.42, Math.PI*0.1, Math.PI*0.9);
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath(); ctx.ellipse(cx, headY + 30, 9, 13, 0, 0, Math.PI); ctx.fill();
          ctx.lineWidth = 3;
          arc(cx, headY + 30, 9, 0, Math.PI);
          break;

        case 'Tired': // droopy half-closed eyes, slight frown
          // Eyes: half closed (just upper half arc, drooping)
          ctx.lineWidth = 4;
          arc(cx - ex, headY - ey, 12, Math.PI*1.15, Math.PI*1.85);
          arc(cx + ex, headY - ey, 12, Math.PI*1.15, Math.PI*1.85);
          // Droopy lower lid
          arc(cx - ex, headY - ey + 4, 12, Math.PI*0.1, Math.PI*0.9);
          arc(cx + ex, headY - ey + 4, 12, Math.PI*0.1, Math.PI*0.9);
          // Flat/droopy brows
          ctx.lineWidth = 4.5;
          line(cx - ex - 14, browY + 4, cx - ex + 14, browY + 8, 4.5);
          line(cx + ex - 14, browY + 4, cx + ex + 14, browY + 8, 4.5);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          // Small neutral/slight frown
          ctx.beginPath();
          ctx.moveTo(cx - 18, headY + 25);
          ctx.quadraticCurveTo(cx, headY + 32, cx + 18, headY + 25);
          ctx.stroke();
          break;

        case 'Cool': // sunglasses, smile
          // Shades
          ctx.fillStyle = '#111';
          ctx.beginPath();
          ctx.roundRect(cx - ex - 16, headY - ey - 12, 30, 20, 4);
          ctx.fill();
          ctx.beginPath();
          ctx.roundRect(cx + ex - 14, headY - ey - 12, 30, 20, 4);
          ctx.fill();
          ctx.lineWidth = 3;
          line(cx - ex + 14, headY - ey, cx + ex - 14, headY - ey, 3);
          // Temples
          line(cx - ex - 16, headY - ey, cx - ex - 30, headY - ey - 4, 3);
          line(cx + ex + 16, headY - ey, cx + ex + 30, headY - ey - 4, 3);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          arc(cx, headY + 16, headR*0.36, Math.PI*0.15, Math.PI*0.85);
          break;

        case 'Smug': // one raised brow, half-smile/grin showing teeth
          dot(cx - ex, headY - ey, 7);
          dot(cx + ex, headY - ey, 7);
          // Left brow up (smug), right lower
          ctx.lineWidth = 4.5;
          arc(cx - ex, browY - 8, 13, Math.PI*1.1, Math.PI*1.9);
          line(cx + ex - 14, browY + 2, cx + ex + 14, browY - 4, 4.5);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          // Grin showing teeth
          ctx.beginPath();
          ctx.moveTo(cx - 26, headY + 14);
          ctx.quadraticCurveTo(cx, headY + 36, cx + 26, headY + 14);
          ctx.stroke();
          // Teeth
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.roundRect(cx - 22, headY + 14, 44, 14, [0,0,4,4]);
          ctx.fill();
          ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
          ctx.strokeRect(cx - 22, headY + 14, 44, 14);
          // Tooth dividers
          line(cx - 8, headY + 14, cx - 8, headY + 28, 2);
          line(cx + 8, headY + 14, cx + 8, headY + 28, 2);
          break;

        case 'Crying': // tear, sad brows, frown
          dot(cx - ex, headY - ey, 7);
          dot(cx + ex, headY - ey, 7);
          // Sad brows: outer ends drop
          ctx.lineWidth = 4.5;
          line(cx - ex - 14, browY + 5, cx - ex + 10, browY - 5, 4.5);
          line(cx + ex + 14, browY + 5, cx + ex - 10, browY - 5, 4.5);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          arc(cx, headY + 55, headR*0.4, Math.PI*1.15, Math.PI*1.85);
          // Teardrop left eye
          ctx.fillStyle = '#5dade2';
          ctx.beginPath();
          ctx.moveTo(cx - ex, headY - ey + 9);
          ctx.bezierCurveTo(cx - ex - 7, headY - ey + 20, cx - ex + 7, headY - ey + 20, cx - ex, headY - ey + 9);
          ctx.arc(cx - ex, headY - ey + 20, 7, 0, Math.PI*2);
          ctx.fill();
          break;

        case 'Nervous': // wide eyes, wavy teeth-clench mouth
          ctx.lineWidth = 4;
          arc(cx - ex, headY - ey, 13, 0, Math.PI*2);
          arc(cx + ex, headY - ey, 13, 0, Math.PI*2);
          dot(cx - ex, headY - ey, 4);
          dot(cx + ex, headY - ey, 4);
          // Slightly raised brows
          ctx.lineWidth = 4.5;
          arc(cx - ex, browY - 4, 13, Math.PI*1.1, Math.PI*1.9);
          arc(cx + ex, browY - 4, 13, Math.PI*1.1, Math.PI*1.9);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          // Wavy clenched mouth
          ctx.beginPath();
          ctx.moveTo(cx - 22, headY + 20);
          for (let i = 0; i < 4; i++) {
            ctx.quadraticCurveTo(
              cx - 22 + (i + 0.5) * 11, headY + (i % 2 === 0 ? 12 : 28),
              cx - 22 + (i + 1) * 11, headY + 20
            );
          }
          ctx.stroke();
          break;

        case 'Scared': // spiral-ish wide eyes, sweat drop, zigzag mouth
          // Eyes with spirals (use concentric arcs)
          ctx.lineWidth = 3.5;
          arc(cx - ex, headY - ey, 13, 0, Math.PI*2);
          arc(cx - ex, headY - ey, 7,  0, Math.PI*2);
          dot(cx - ex, headY - ey, 3);
          arc(cx + ex, headY - ey, 13, 0, Math.PI*2);
          arc(cx + ex, headY - ey, 7,  0, Math.PI*2);
          dot(cx + ex, headY - ey, 3);
          ctx.lineWidth = 4.5;
          arc(cx - ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          arc(cx + ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          // Zigzag mouth
          ctx.beginPath();
          ctx.moveTo(cx - 22, headY + 14);
          const zigPts = [cx-11,headY+26, cx,headY+14, cx+11,headY+26, cx+22,headY+14];
          for (let i = 0; i < zigPts.length; i+=2) ctx.lineTo(zigPts[i], zigPts[i+1]);
          ctx.stroke();
          // Sweat drop top right
          ctx.fillStyle = '#5dade2';
          ctx.beginPath();
          ctx.moveTo(cx + ex + 18, headY - ey - 22);
          ctx.bezierCurveTo(cx + ex + 10, headY - ey - 8, cx + ex + 28, headY - ey - 8, cx + ex + 18, headY - ey - 22);
          ctx.arc(cx + ex + 18, headY - ey - 8, 6, 0, Math.PI*2);
          ctx.fill();
          break;

        case 'Laughing': // squinting eyes, cheek lines, big open-mouth laugh
          ctx.lineWidth = 5;
          // Squinting — just arcs curving upward
          arc(cx - ex, headY - ey + 2, 13, Math.PI*1.05, Math.PI*1.95);
          arc(cx + ex, headY - ey + 2, 13, Math.PI*1.05, Math.PI*1.95);
          // Cheek crinkle lines
          ctx.lineWidth = 3;
          line(cx - ex - 20, headY - ey + 10, cx - ex - 12, headY - ey + 6, 3);
          line(cx - ex - 20, headY - ey + 17, cx - ex - 12, headY - ey + 13, 3);
          line(cx + ex + 20, headY - ey + 10, cx + ex + 12, headY - ey + 6, 3);
          line(cx + ex + 20, headY - ey + 17, cx + ex + 12, headY - ey + 13, 3);
          ctx.lineWidth = 4.5;
          arc(cx - ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          arc(cx + ex, browY, 13, Math.PI*1.1, Math.PI*1.9);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          // Big open mouth
          ctx.beginPath();
          ctx.moveTo(cx - 28, headY + 10);
          ctx.quadraticCurveTo(cx, headY + 50, cx + 28, headY + 10);
          ctx.stroke();
          // Inside mouth dark
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.moveTo(cx - 26, headY + 12);
          ctx.quadraticCurveTo(cx, headY + 48, cx + 26, headY + 12);
          ctx.lineTo(cx + 26, headY + 12);
          ctx.fill();
          // Teeth
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.roundRect(cx - 22, headY + 10, 44, 14, [4,4,0,0]);
          ctx.fill();
          ctx.lineWidth = 2;
          line(cx - 8, headY + 10, cx - 8, headY + 24, 2);
          line(cx + 8, headY + 10, ctx.lineWidth = 2, headY + 24, 2);
          line(cx + 8, headY + 10, cx + 8, headY + 24, 2);
          break;

        default:
          dot(cx - ex, headY - ey, 7);
          dot(cx + ex, headY - ey, 7);
          dot(cx, headY + headR*0.16, 4);
          ctx.lineWidth = 5;
          arc(cx, headY + 14, headR*0.42, Math.PI*0.15, Math.PI*0.85);
      }
    }

    /* ==================== */
    /*    HAT DRAWING       */
    /* ==================== */

    function drawHat(ctx, cx, headY, headR, hat, behind) {

      if (hat === 'None') return;

      ctx.strokeStyle = '#111';

      if (hat === 'Top Hat') {
        if (!behind) {
          ctx.fillStyle = '#222';
          ctx.lineWidth = 4;
          ctx.fillRect(cx - headR - 6, headY - headR - 6, (headR + 6) * 2, 14);
          ctx.strokeRect(cx - headR - 6, headY - headR - 6, (headR + 6) * 2, 14);
          ctx.fillRect(cx - headR * 0.55, headY - headR - 62, headR * 1.1, 58);
          ctx.strokeRect(cx - headR * 0.55, headY - headR - 62, headR * 1.1, 58);
        }
      } else if (hat === 'Beanie') {
        if (!behind) {
          ctx.fillStyle = '#e74c3c';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.ellipse(cx, headY - headR + 10, headR + 4, headR * 0.68, 0, Math.PI, 0);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(cx, headY - headR - 22, 17, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      } else if (hat === 'Halo') {
        if (!behind) {
          ctx.strokeStyle = '#f1c40f';
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.ellipse(cx, headY - headR - 22, headR * 0.72, 15, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = '#111';
          ctx.lineWidth = 6;
        }
      } else if (hat === 'Crown') {
        if (!behind) {
          ctx.fillStyle = '#f1c40f';
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#111';
          ctx.beginPath();
          const cr = headR * 0.85;
          ctx.moveTo(cx - cr, headY - headR + 5);
          ctx.lineTo(cx - cr, headY - headR - 42);
          ctx.lineTo(cx - cr * 0.4, headY - headR - 18);
          ctx.lineTo(cx, headY - headR - 52);
          ctx.lineTo(cx + cr * 0.4, headY - headR - 18);
          ctx.lineTo(cx + cr, headY - headR - 42);
          ctx.lineTo(cx + cr, headY - headR + 5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }
    }

    /* ==================== */
    /*   SAVE / LOAD        */
    /* ==================== */

    function saveCharacter() {
      const saved = {};
      features.forEach(f => { saved[f.key] = f.idx; });
      localStorage.setItem('pyb_character', JSON.stringify(saved));
      window.location.href = 'user-menu.html';
    }

    function loadSaved() {
      try {
        const saved = JSON.parse(localStorage.getItem('pyb_character') || '{}');
        features.forEach(f => {
          if (saved[f.key] !== undefined) f.idx = saved[f.key];
        });
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSaved();
      buildArrows();
      render();
    });
  </script>
</body>
</html>
